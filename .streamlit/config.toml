# Identidad visual de Tutor Universitario. Los estilos que el tema no cubre están en core/estilo.py.
# El tema claro u oscuro sigue al del sistema; también se cambia con el botón de la barra lateral.

[client]
# Oculta el botón «Deploy» y el menú de desarrollo para que la app se vea como un producto terminado
toolbarMode = "minimal"

[theme]
baseRadius = "0.75rem"
buttonRadius = "0.75rem"
showWidgetBorder = true
showSidebarBorder = false
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap, sans-serif"
headingFontWeights = [800, 700, 700, 700, 600, 600]
metricValueFontWeight = 800
chartCategoricalColors = ["#4F46E5", "#14B8A6", "#F59E0B", "#EC4899", "#8B5CF6", "#0EA5E9", "#22C55E", "#F43F5E"]

[theme.light]
primaryColor = "#4F46E5"
backgroundColor = "#F6F7FB"
secondaryBackgroundColor = "#EEF0F8"
textColor = "#1E1B4B"
linkColor = "#4F46E5"
borderColor = "#E2E5F1"
dataframeHeaderBackgroundColor = "#EEF0FA"
greenColor = "#059669"
redColor = "#DC2626"
blueColor = "#4F46E5"

[theme.light.sidebar]
backgroundColor = "#17153B"
secondaryBackgroundColor = "#25225A"
textColor = "#E0E7FF"
primaryColor = "#A5B4FC"
borderColor = "#34307A"
linkColor = "#C7D2FE"

[theme.dark]
primaryColor = "#818CF8"
backgroundColor = "#111028"
secondaryBackgroundColor = "#1D1A44"
textColor = "#E8EAFF"
linkColor = "#A5B4FC"
borderColor = "#2E2B63"
dataframeHeaderBackgroundColor = "#25225A"
greenColor = "#34D399"
redColor = "#F87171"
blueColor = "#818CF8"

[theme.dark.sidebar]
backgroundColor = "#0B0A1F"
secondaryBackgroundColor = "#1A1740"
textColor = "#E0E7FF"
primaryColor = "#A5B4FC"
borderColor = "#2A2760"
linkColor = "#C7D2FE"



